controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    mat_controleur:
      type: joint_trajectory_controller/JointTrajectoryController

mat_controleur:
  ros__parameters:
    joints:
      - mat_1_joint
      - mat_2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position